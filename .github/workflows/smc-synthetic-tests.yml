name: SMC synthetic tests
on:
  push:
    branches:
      - fix/smc-cross-timeframe-conflict-20261119
      - upgrade/apa-topdown-m1-entry-20261120
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js # syntax gate after strategy reasoning fix
      - run: node --check smc-intraday.js
      - run: node --input-type=module --check < mt5-bridge/worker.js
      - run: node tests/smc-synthetic.test.js
