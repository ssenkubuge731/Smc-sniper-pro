
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC Sniper Pro</title>
<style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
header {
  text-align: center;

h1 { color: #20d69a; }

<body>
<header>
<h1>SMC SNIPER PRO</h1>
<p>Deriv Trading Assistant</p>
</header>

<div class="card">
<h2>Dashboard</h2>
<p>Connection: <span class="status">Not connected</span></p>
<p>Platform: Deriv</p>
<p>Trading mode: Demo</p>
</div>

<div class="card">
<button onclick="loadDerivMarkets()">LOAD ALL DERIV MARKETS</button>
<script>
  function loadDerivMarkets() {
  const status = document.getElementById("marketStatus");
  const marketSelect = document.getElementById("market");

  status.textContent = "Connecting to Deriv...";

  const ws = new WebSocket(
    "wss://api.derivws.com/trading/v1/options/ws/public"
  );

  ws.onopen = function () {
    status.textContent = "Connected. Loading markets...";

    ws.send(JSON.stringify({
      active_symbols: "brief",
      req_id: 1
    }));
  };

  ws.onmessage = function (event) {
    const data = JSON.parse(event.data);

    if (data.error) {
      status.textContent = "Deriv error: " + data.error.message;
      ws.close();
      return;
    }

    if (data.msg_type === "active_symbols") {
      const symbols = data.active_symbols || [];

      const indices = symbols.filter(function (item) {
        return item.market === "synthetic_index";
      });

      if (indices.length === 0) {
        status.textContent =
          "Markets received, but no synthetic indices were found.";
        ws.close();
        return;
      }

      marketSelect.innerHTML = "";

      indices.forEach(function (item) {
        const option = document.createElement("option");
        option.value = item.symbol;
        option.textContent = item.display_name;
        marketSelect.appendChild(option);
      });

      status.textContent =
        indices.length + " synthetic markets loaded successfully.";

      ws.close();
    }
  };

  ws.onerror = function () {
    status.textContent = "Connection failed. Please try again.";
  };

  ws.onclose = function () {
    console.log("Market list connection closed.");
  };
}
  <h3>Available Markets</h3>
  <button onclick="loadDerivMarkets()">
  LOAD ALL DERIV MARKETS
</button>

<p id="marketStatus">Waiting for markets...</p>
</button>

<p id="marketStatus">Waiting for markets...</p>
  <div class="card">
  <h3>Available Markets</h3>
  <select id="market">
    <option value="R_10">Volatility 10 Index</option>
    <option value="R_25">Volatility 25 Index</option>
    <option value="R_50">Volatility 50 Index</option>
    <option value="R_75">Volatility 75 Index</option>
    <option value="R_100">Volatility 100 Index</option>
  </select>

  <button onclick="scanMarket()">SCAN MARKET</button>

  <p id="scanResult">Waiting for scan...</p>
  </div>
<p>Scan available Deriv indices.</p>
<p>Waiting for market data...</p>
</div>

<div class="card">
<h2>Smart Money Concepts</h2>
<p>Order Blocks: Ready</p>
<p>Supply and Demand: Ready</p>
<p>Break of Structure: Ready</p>
<p>Liquidity Sweeps: Ready</p>
</div>

<div class="card">
<h2>Trading Controls</h2>
<p>Risk management: 0.5%</p>
<button disabled>Connect Deriv API (Coming next)</button>
<p>Trading is not active.</p>
</div>
<script>
async function scanMarket() {
  const market = document.getElementById("market").value;
  const result = document.getElementById("scanResult");

  result.textContent = "Connecting to Deriv...";

  let ws;

  try {
    ws = new WebSocket(
      "wss://api.derivws.com/trading/v1/options/ws/public"
    );

    ws.onopen = () => {
      ws.send(JSON.stringify({
        ticks: market,
        subscribe: 1
      }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.error) {
        result.textContent = "Error: " + data.error.message;
        ws.close();
        return;
      }

      if (data.tick) {
        result.textContent =
          "Market: " + market +
          " | Latest price: " + data.tick.quote;
      }
    };

    ws.onerror = () => {
      result.textContent = "Connection error. Try again.";
    };

  } catch (error) {
    result.textContent = "Scanner error: " + error.message;
  }
}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const riskForm = document.getElementById("riskSettingsForm");
  const status = document.getElementById("riskStatus");

  if (!riskForm || !status) {
    console.log("Risk settings section not found.");
    return;
  }

  riskForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const risk = Number(document.getElementById("riskPercent").value);
    const trades = Number(document.getElementById("maxTrades").value);
    const daily = Number(document.getElementById("dailyLoss").value);
    const losses = Number(document.getElementById("lossLimit").value);

    if (!Number.isFinite(risk) || risk < 0.01 || risk > 5 ||
        !Number.isInteger(trades) || trades < 1 || trades > 20 ||
        !Number.isFinite(daily) || daily < 0.1 || daily > 20 ||
        !Number.isInteger(losses) || losses < 1 || losses > 20) {
      status.textContent = "Invalid settings. Check your values.";
      return;
    }

    window.smcRiskSettings = {
      riskPercent: risk,
      maxTrades: trades,
      dailyLossLimit: daily,
      pauseAfterLosses: losses,
      tradingMode: "DEMO"
    };

    status.textContent = "Settings saved for this session. Demo mode only.";
  });
});

  <section class="card">
  <h2>APA Risk Management Settings</h2>

  <p>Trading Mode:
    <strong style="color:green;">DEMO ONLY</strong>
  </p>

  <form id="riskSettingsForm">
    <label>Risk per trade (%)</label>
    <input type="number" id="riskPercent" value="0.5"
      min="0.01" max="5" step="0.01" required>

    <label>Maximum open trades</label>
    <input type="number" id="maxTrades" value="2"
      min="1" max="20" step="1" required>

    <label>Daily loss limit (%)</label>
    <input type="number" id="dailyLoss" value="2"
      min="0.1" max="20" step="0.1" required>

    <label>Pause after consecutive losses</label>
    <input type="number" id="lossLimit" value="3"
      min="1" max="20" step="1" required>

    <button type="submit">SAVE RISK SETTINGS</button>
  </form>

  <p id="riskStatus">Default settings loaded.</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("riskSettingsForm");
  const status = document.getElementById("riskStatus");

  if (!form || !status) return;

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const risk = Number(document.getElementById("riskPercent").value);
    const trades = Number(document.getElementById("maxTrades").value);
    const daily = Number(document.getElementById("dailyLoss").value);
    const losses = Number(document.getElementById("lossLimit").value);

    if (risk < 0.01 || risk > 5 ||
        !Number.isInteger(trades) || trades < 1 || trades > 20 ||
        daily < 0.1 || daily > 20 ||
        !Number.isInteger(losses) || losses < 1 || losses > 20) {
      status.textContent = "Invalid settings. Check your values.";
      return;
    }

    window.smcRiskSettings = {
      riskPercent: risk,
      maxTrades: trades,
      dailyLossLimit: daily,
      pauseAfterLosses: losses,
      tradingMode: "DEMO"
    };

    status.textContent =
      "Settings saved for this session. DEMO ONLY.";
  });
});
